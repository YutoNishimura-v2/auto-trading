name: Gemini Sniper Daily Run

on:
  schedule:
    - cron: '0 21 * * 1-5' # Runs at 21:00 UTC (Market Close) on weekdays
  workflow_dispatch: # Allow manual trigger

jobs:
  analyze_and_trade:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        
    - name: Run Gemini Sniper
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_MODEL_NAME: "gemini-2.0-flash-exp"
      run: |
        python main.py
        
    - name: Upload Artifacts (Logs & Portfolio)
      uses: actions/upload-artifact@v4
      with:
        name: run-artifacts
        path: |
          gemini_sniper.log
          paper_portfolio.json
